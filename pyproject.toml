[project]
name = "titanic-ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bethuel Ngetich", email = "ngetichbethuel100@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "kaggle>=2.2.5",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "notebook>=7.6.4",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pathlib>=1.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
titanic-ml = "titanic_ml:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
